name: ui-test

# UI checks run on a KVM-capable runner, not the Codex cloud container.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - '.release-please-manifest.json'
      - 'scripts/nova-smoke.sh'
      - '.github/workflows/ui-test.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - '.release-please-manifest.json'
      - 'scripts/nova-smoke.sh'
      - '.github/workflows/ui-test.yml'

permissions:
  contents: read

concurrency:
  group: ui-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NOVA_SMOKE_OUT: ui-test-results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Enable and verify KVM
        run: |
          mkdir -p "$NOVA_SMOKE_OUT"
          test -e /dev/kvm || { echo '::error::Runner does not expose /dev/kvm'; exit 1; }
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
          { uname -a; ls -l /dev/kvm; java -version; } > "$NOVA_SMOKE_OUT/runner.txt" 2>&1

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Verify Nova and original shooter screens
        id: smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          cores: 2
          emulator-boot-timeout: 600
          disable-animations: false
          emulator-options: -accel on -no-snapshot -no-window -gpu swiftshader -feature -Vulkan -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/nova-smoke.sh

      - name: Summarize screen checks
        if: always()
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          if [ -f "$NOVA_SMOKE_OUT/summary.md" ]; then
            cat "$NOVA_SMOKE_OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'UI test did not reach the smoke script (emulator step: %s). See build / KVM / emulator logs.\n' "$SMOKE_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: ui-test-results/
          retention-days: 14
          if-no-files-found: warn
