name: emulator-test

# 只在需要時手動觸發：在模擬器上跑煙霧測試，結果推到 emulator-results 分支。
on:
  workflow_dispatch:
    inputs:
      stage:
        description: 射擊遊戲關卡
        default: "1"
      cat:
        description: ORANGE 或 BLACK
        default: ORANGE
      seconds:
        description: 遊玩秒數
        default: "110"

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/emulator-smoke.sh "${{ inputs.stage }}" "${{ inputs.cat }}" "${{ inputs.seconds }}"

      - name: Publish results
        if: always()
        run: |
          mkdir -p emulator-results-out
          cd emulator-results-out
          echo "commit ${{ github.sha }}, run ${{ github.run_id }}" > RUN.txt
          git init -q
          git checkout -q -b emulator-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Emulator results for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" emulator-results
