name: release-please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  # 先跑單元測試並確認能建置，失敗就不發版。
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug build
        run: ./gradlew testDebugUnitTest assembleDebug

  release-please:
    needs: check
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created || steps.release-after-merge.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name || steps.release-after-merge.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # 自動合併 Release PR。PR 沒變動時 release-please 不會輸出 pr，
      # 而 label 搜尋有索引延遲、可能找不到剛開的 PR，所以直接用 REST API 依分支查詢。
      # 用 GITHUB_TOKEN 合併不會再觸發這個 workflow，
      # 所以合併後在同一個 job 內再跑一次 release-please 來建立 tag 與 Release。
      - name: Auto-merge release PR
        id: automerge
        if: ${{ !steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prs=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&head=$GITHUB_REPOSITORY_OWNER:release-please--branches--main" \
            --jq '.[].number')
          for pr in $prs; do
            gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
            echo "merged=true" >> "$GITHUB_OUTPUT"
          done
          sleep 5

      - uses: googleapis/release-please-action@v4
        id: release-after-merge
        if: ${{ steps.automerge.outputs.merged == 'true' }}
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            # 用 debug 金鑰簽的 APK 之後無法被正式版覆蓋安裝，所以直接失敗。
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/773CatPlayground-${TAG}.apk"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
