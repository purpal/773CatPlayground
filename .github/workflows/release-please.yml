name: release-please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created || steps.release-after-merge.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name || steps.release-after-merge.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # 自動合併 Release PR（PR 沒變動時 release-please 不會輸出 pr，所以直接用 label 找）。
      # 用 GITHUB_TOKEN 合併不會再觸發這個 workflow，
      # 所以合併後在同一個 job 內再跑一次 release-please 來建立 tag 與 Release。
      - name: Auto-merge release PR
        id: automerge
        if: ${{ !steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base main \
            --label "autorelease: pending" --json number --jq '.[].number')
          for pr in $prs; do
            gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
            echo "merged=true" >> "$GITHUB_OUTPUT"
          done
          sleep 5

      - uses: googleapis/release-please-action@v4
        id: release-after-merge
        if: ${{ steps.automerge.outputs.merged == 'true' }}
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      # 之後有實際建置步驟（打包遊戲等）時改這裡，產出的檔案放到 dist/
      - name: Build
        run: |
          mkdir -p dist
          git archive --format=zip --prefix="773CatPlayground-${TAG}/" -o "dist/773CatPlayground-${TAG}.zip" HEAD

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
