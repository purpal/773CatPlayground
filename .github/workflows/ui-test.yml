name: ui-test

# UI checks run on a KVM-capable runner, not the Codex cloud container.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - 'scripts/nova-smoke.sh'
      - '.github/workflows/ui-test.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - '.release-please-manifest.json'
      - 'scripts/nova-smoke.sh'
      - '.github/workflows/ui-test.yml'

permissions:
  contents: read

concurrency:
  group: ui-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NOVA_SMOKE_OUT: ui-test-results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Enable and verify KVM
        run: |
          mkdir -p "$NOVA_SMOKE_OUT"
          test -e /dev/kvm || { echo '::error::Runner does not expose /dev/kvm'; exit 1; }
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
          { uname -a; ls -l /dev/kvm; java -version; } > "$NOVA_SMOKE_OUT/runner.txt" 2>&1

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Verify Nova and original shooter screens
        id: smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          cores: 2
          emulator-boot-timeout: 600
          disable-animations: false
          emulator-options: -accel on -no-snapshot -no-window -gpu swiftshader -feature -Vulkan -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/nova-smoke.sh

      - name: Summarize screen checks
        if: always()
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          if [ -f "$NOVA_SMOKE_OUT/summary.md" ]; then
            cat "$NOVA_SMOKE_OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'UI test did not reach the smoke script (emulator step: %s). See build / KVM / emulator logs.\n' "$SMOKE_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: ui-test-results/
          retention-days: 14
          if-no-files-found: warn

  # Keep a browsable latest report, matching this repo's emulator-results pattern.
  # Only trusted main pushes can publish; PR runs retain read-only permissions.
  publish-report:
    needs: screens
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ui-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: report
      - name: Publish latest UI evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cd report
          printf 'Commit: %s\nRun: %s\n' "$SOURCE_SHA" "$RUN_URL" > RUN.txt
          git init -q
          git checkout -q -b emulator-results-ui
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -qm "UI evidence for $SOURCE_SHA"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          previous=$(git ls-remote "$remote" refs/heads/emulator-results-ui | cut -f1)
          git push --force-with-lease="refs/heads/emulator-results-ui:$previous" "$remote" HEAD:refs/heads/emulator-results-ui
